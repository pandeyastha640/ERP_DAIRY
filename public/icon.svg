<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="dairyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0969da" />
      <stop offset="100%" stop-color="#054da7" />
    </linearGradient>
    <linearGradient id="dropGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e6edf3" />
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0b429" />
      <stop offset="100%" stop-color="#d69e2e" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Base Rounded Rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#dairyGradient)" filter="url(#shadow)" />

  <!-- Technical Circuit & Grid Accents -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#58a6ff" stroke-width="2" stroke-dasharray="6,8" opacity="0.4" />
  <circle cx="256" cy="256" r="215" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.15" />

  <!-- Outer Ring Indicators -->
  <circle cx="256" cy="66" r="6" fill="#58a6ff" />
  <circle cx="446" cy="256" r="6" fill="#58a6ff" />
  <circle cx="256" cy="446" r="6" fill="#58a6ff" />
  <circle cx="66" cy="256" r="6" fill="#58a6ff" />

  <!-- Milk Drop Core Symbol -->
  <path d="M 256,120 C 256,120 160,260 160,320 C 160,373 203,416 256,416 C 309,416 352,373 352,320 C 352,260 256,120 256,120 Z" fill="url(#dropGradient)" />

  <!-- Drop Reflection Highlight -->
  <path d="M 210,310 C 205,290 220,240 238,205 C 235,225 220,285 224,315 C 226,325 212,320 210,310 Z" fill="#ffffff" opacity="0.75" />

  <!-- Digital Sensor Flow Nodes inside Drop -->
  <circle cx="256" cy="300" r="14" fill="#0969da" />
  <circle cx="256" cy="300" r="6" fill="#58a6ff" />
  <line x1="256" y1="314" x2="256" y2="350" stroke="#0969da" stroke-width="4" stroke-linecap="round" />
  <line x1="240" y1="350" x2="272" y2="350" stroke="#0969da" stroke-width="4" stroke-linecap="round" />

  <!-- Quality Star Crest -->
  <polygon points="256,145 261,158 275,158 264,166 268,179 256,171 244,179 248,166 237,158 251,158" fill="url(#goldGradient)" />
</svg>
