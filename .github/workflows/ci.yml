name: DairyOS Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit-and-verify:
    name: Subsystem Verification & Build
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "file:./dev.db"
      PORT: 5000
      JWT_SECRET: "dairyos-ci-testing-key-2026"
      NODE_ENV: "test"

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm install --legacy-peer-deps

      - name: Initialize Database Schema & Seed Data
        run: |
          npx prisma generate
          npx prisma db push --skip-generate
          npm run seed

      - name: Validate TypeScript Static Typing
        run: npm run lint

      - name: Build Production Client Assets (Vite)
        run: npm run build

      - name: Start Server & Execute 11-Phase Enterprise Verification Test Suite
        run: |
          npm run server &
          SERVER_PID=$!
          echo "Waiting for DairyOS API Server on port 5000..."
          READY=0
          for i in $(seq 1 30); do
            if curl -s http://localhost:5000/healthz > /dev/null; then
              echo "✅ Backend API Server ready (PID $SERVER_PID) after ${i}s"
              READY=1
              break
            fi
            sleep 1
          done
          if [ $READY -ne 1 ]; then
            echo "❌ Backend API Server failed to respond on port 5000 within 30 seconds"
            exit 1
          fi
          npx tsx scripts/verify_all_phases.ts
          kill $SERVER_PID
