# Single-instance Docker deployment for evaluation/staging.
# The Prisma schema currently uses SQLite. Do not scale the API to multiple
# replicas or treat this as a production deployment until a reviewed
# PostgreSQL migration history and backup/restore plan exist.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dairyos_web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - dairyos_network

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: dairyos_api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: file:/app/data/dairyos.db
      JWT_SECRET: ${JWT_SECRET:?Set a unique JWT_SECRET in the deployment environment}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - dairyos_data:/app/data
    expose:
      - "5000"
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - dairyos_network

  # Initial schema bootstrap for this single-instance SQLite staging setup.
  # For production, replace this with reviewed, versioned Prisma migrations.
  db-init:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: dairyos_db_init
    restart: "no"
    environment:
      DATABASE_URL: file:/app/data/dairyos.db
    volumes:
      - dairyos_data:/app/data
    command: ["npx", "prisma", "db", "push", "--skip-generate"]
    networks:
      - dairyos_network

volumes:
  dairyos_data:
    name: dairyos_data

networks:
  dairyos_network:
    name: dairyos_network
    driver: bridge
